# Lint and test on every push and pull request.
#
# Each job only runs when its own paths changed (see the `changes` job, which
# uses dorny/paths-filter). A skipped job still reports as a passing check, so
# this is safe to use as a required status check.
#
# Deliberately cheap: `uv sync` with no extra groups, so this installs the
# runtime set plus dev tooling and nothing else. The heavy groups (`analysis`,
# `dx`) are not exercised here -- if a job ever needs them, add a separate one
# rather than growing this matrix, so a broken plotting dependency can never
# block a pipeline fix.
#
# The Docker images are built by docker.yml, manually. Nothing here builds them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR cancels the run still going for the previous one.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/python/**'
              - 'tests/python/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'scripts/**/*.sh'
              - '.github/workflows/ci.yml'

  python:
    name: Python (lint + tests)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: fail if uv.lock disagrees with pyproject.toml rather than
      # silently resolving something else. That is the whole point of committing
      # the lockfile -- CI must install exactly what a contributor installs.
      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/python tests/python

      - name: Tests
        run: uv run pytest -q

  backend:
    name: Backend (lint + tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # backend/ is its own uv project with its own lockfile, not a workspace
      # member of the root one. See backend/pyproject.toml.
      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app scripts

      - name: Tests
        run: uv run pytest -q

  shell:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every .sh in the repo now lives under scripts/, so one glob covers them.
      - name: shellcheck
        run: shellcheck --severity=error $(git ls-files 'scripts/**/*.sh')
