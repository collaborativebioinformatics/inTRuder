[project]
name = "noveltrs"
version = "0.1.0"
description = "Identifying novel human tandem-repeat loci absent from the reference genome"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Add runtime dependencies here, e.g. with `uv add pandas`
dependencies = [
    "cyvcf2>=0.34.0",
    "numpy>=2.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "parasail>=1.3.4",
    "pytrf>=1.5.0",
    "tqdm>=4.70.0",
]

[project.scripts]
# `uv run novelty ...` from anywhere in the repo.
novelty = "novelty.cli:main"
evo-embed = "evo.embeddings.cli:main"

[project.optional-dependencies]
# Analysis half of the Evo 2 work: reduction, clustering, outlier scoring, plots.
# Pure CPU -- no torch, no GPU -- so it installs anywhere and is the half you
# iterate on locally against vectors the cluster produced.
analysis = [
    "scikit-learn>=1.7",
    "umap-learn>=0.5.9",
    "matplotlib>=3.10",
]

# Extraction half. Two things are deliberately absent:
#   * `evo2` is capped below this project's default 3.13 by its own metadata, so
#     the marker lets `--extra embed` still resolve on 3.13 (giving pyfaidx and
#     window building without a GPU) and pull evo2 only on a 3.12 cluster venv.
#   * flash-attn is NOT listed. It needs nvcc and --no-build-isolation, so it is
#     a manual step before `uv sync` on the cluster; putting it here would make
#     the lock unresolvable everywhere else.
embed = [
    "pyfaidx>=0.8",
    "evo2>=0.2 ; python_version < '3.13'",
]

# Jupyter, for the notebooks under notebooks/. Kept out of the default sync so
# `uv sync` stays light for people who never open one.
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

# Torch backends. Mutually exclusive -- see [tool.uv] conflicts. Evo 2 wants
# torch 2.6.x/2.7.x on CUDA 12.1+; rocm is here for parity but evo2 itself is
# CUDA-only, so `--extra rocm` gets you torch and nothing that runs Evo 2.
cpu = ["torch>=2.6,<2.8"]
cu126 = ["torch>=2.6,<2.8"]
cu128 = ["torch>=2.6,<2.8"]
rocm = ["torch>=2.6,<2.8", "pytorch-triton-rocm"]

[dependency-groups]
# Dev-only tooling; install with `uv sync` (included by default)
dev = [
    "ruff>=0.6",
    "pytest>=8",
]
dx = [
    "dxpy>=0.412.0",
]

[tool.uv]
# umap-learn pulls numba, which pins llvmlite tightly. llvmlite stopped shipping
# Intel-macOS wheels at 0.46, so on that platform uv falls back to building it
# from source and needs a full LLVM toolchain. Capping it there keeps `--extra
# analysis` a wheel-only install; every other platform is unaffected.
# Both ends are needed: capping llvmlite alone lets uv walk numba backwards past
# the Python versions it supports rather than settle on a 3.13-capable pair.
# 0.61-0.62 are the numba releases that both support 3.13 and ship this wheel.
constraint-dependencies = [
    "llvmlite<0.46 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba>=0.61 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Only one torch backend may be resolved at a time; uv would otherwise try to
# satisfy all four indexes at once.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

# `explicit = true` keeps these indexes from being consulted for anything that
# does not name them above, so the rest of the tree still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `novelty` and `evo` are installed (editable, so edits take effect at once) to
# put their commands on PATH. Everything else under src/python stays a loose
# script and is not part of the distribution.
module-root = "src/python"
module-name = ["novelty", "evo"]

[tool.ruff]
line-length = 100
src = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# `novelty` is installed editable, but keeping src/python on sys.path means the
# tests also run against a bare checkout that has not been synced.
pythonpath = ["src/python"]
# Required, not cosmetic. Each step keeps its own test package, so basenames
# repeat -- `test_cli.py` exists under both tests/python/novelty/ and
# tests/python/evo/. pytest's default prepend mode keys modules by basename and
# refuses the second one. Do not "fix" that with __init__.py files:
# tests/python/novelty/ would then import as `novelty` and shadow the real
# package.
addopts = ["--import-mode=importlib"]
