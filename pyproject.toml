[project]
name = "intruder"
version = "1.0.0"
description = "Identifying novel human tandem-repeat loci absent from the reference genome"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies: what a pipeline step needs to run. Add with `uv add X`.
# Anything only one heavy subsystem needs belongs in a group below instead, so a
# plain `uv sync` stays small enough to build on a laptop.
dependencies = [
    "cyvcf2>=0.34.0",
    "joblib>=1.3",
    "numpy>=2.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "parasail>=1.3.4",
    "pysam>=0.23",
    "pytrf>=1.5.0",
    "tqdm>=4.70.0",
]

[project.scripts]
# `uv run novelty ...` etc. from anywhere in the repo. The command names are
# unchanged from before the move -- only the module paths behind them shift, so
# nobody's notes or Nextflow process bodies break.
svpytrf     = "intruder.pipeline.trf.sv_trfcaller:main"
filter      = "intruder.pipeline.trf.filter_ins_trf:main"
novelty     = "intruder.pipeline.novelty.cli:main"
strchive    = "intruder.pipeline.strchive.__main__:main"
compression = "intruder.pipeline.compression.annotate:main"

[dependency-groups]
# Groups, not extras: nothing here is imported by a pipeline step, so none of it
# belongs in a built wheel. Install with `uv sync --group <name>`; `dev` comes in
# by default. See src/python/README.md for which group covers what.

# Linting, tests and notebook tooling.
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
]

# Plotting and stats for `intruder.analysis`. Kept out of the runtime set because
# the pipeline itself never draws anything, and matplotlib/scikit-learn are a
# large install for a Nextflow worker that only needs to write a TSV.
analysis = [
    "matplotlib>=3.11.1",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "umap-learn>=0.5.6",
]

# The DNAnexus toolkit, for `scripts/dnanexus/dx-*.sh` and anything else that
# talks to the platform. Not in `dev` because `uv sync` installs `dev` by default
# and this is only useful with a token in `.env`. See docs/scripts/DNANexus.md.
dx = [
    "dxpy>=0.412.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One installed package, `intruder`, holding every module in the project:
#   intruder.trcore     shared primitives
#   intruder.pipeline   the pipeline steps
#   intruder.analysis   post-hoc analysis of their output
# It replaces the five bare top-level packages that were installed before
# (trcore, novelty, strchive, svpytrf, filter).
# It is installed editable, so edits take effect without re-syncing. A single
# owned top-level name is deliberate -- `pipeline` or `analysis` on their own
# would collide with real packages in site-packages.
module-root = "src/python"
module-name = "intruder"

[tool.ruff]
line-length = 100
src = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Each step keeps its own test package, so basenames repeat across them
# (tests/python/pipeline/novelty/test_catalog.py and
# tests/python/pipeline/strchive/test_catalog.py). importlib mode imports each by
# full path instead of by basename, which is what lets the two coexist without
# __init__.py scaffolding.
addopts = ["--import-mode=importlib"]
# `intruder` is installed editable, but keeping src/python on sys.path means the
# tests also run against a bare checkout that has not been synced.
pythonpath = ["src/python"]


[tool.ruff.lint.per-file-ignores]
# Pre-existing in files this refactor only moved, surfaced because linting reaches
# src/python for the first time. Deliberately not fixed here: changing behaviour
# in someone else's module inside a layout PR hides the change. The blind `except`
# is load-bearing while the annotator's input format is still settling.
"src/python/intruder/pipeline/annotation/lps_annotate.py" = ["BLE001"]
"src/python/intruder/pipeline/trf/sv_trfcaller.py" = ["SIM115"]
