[project]
name = "noveltrs"
version = "0.1.0"
description = "Identifying novel human tandem-repeat loci absent from the reference genome"
readme = "README.md"
requires-python = ">=3.11"
# Add runtime dependencies here, e.g. with `uv add pandas`
dependencies = [
    "cyvcf2>=0.34.0",
    "numpy>=2.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "parasail>=1.3.4",
    "pytrf>=1.5.0",
    "tqdm>=4.70.0",
]

[project.scripts]
# `uv run novelty ...` from anywhere in the repo.
novelty = "novelty.cli:main"

[dependency-groups]
# Dev-only tooling; install with `uv sync` (included by default)
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The pipeline-step packages, plus the `trcore` primitives they share, are
# installed (editable, so edits take effect at once) to put their commands on
# PATH. Loose scripts under src/python -- such as sv_trfcaller.py -- stay
# scripts and are not part of the distribution.
module-root = "src/python"
module-name = ["trcore", "novelty"]

[tool.ruff]
line-length = 100
src = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# `novelty` is installed editable, but keeping src/python on sys.path means the
# tests also run against a bare checkout that has not been synced.
pythonpath = ["src/python"]
