[project]
name = "noveltrs"
version = "0.1.0"
description = "Identifying novel human tandem-repeat loci absent from the reference genome"
readme = "README.md"
requires-python = ">=3.11"
# Add runtime dependencies here, e.g. with `uv add pandas`
dependencies = [
    "cyvcf2>=0.34.0",
    "numpy>=2.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "parasail>=1.3.4",
    "pytrf>=1.5.0",
    "tqdm>=4.70.0",
    "pandas>=3.0.5",
    "joblib>=1.3",
]

[project.scripts]
# `uv run novelty ...` from anywhere in the repo.
novelty = "novelty.cli:main"

[dependency-groups]
# Dev-only tooling; install with `uv sync` (included by default)
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

# The DNAnexus toolkit, for `scripts/dx-*.sh` and anything else that talks to the
# platform. A group rather than a runtime dependency because nothing under `src/`
# imports it and DNAnexus workers already ship the `dx` CLI; not in `dev` because
# `uv sync` installs `dev` by default and this is only useful with a token in
# `.env`. Install it with `uv sync --group dx`; see docs/scripts/DNANexus.md.
dx = [
    "dxpy>=0.412.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The `novelty` package is installed (editable, so edits take effect at once) to
# put the `novelty` command on PATH. Everything else under src/python stays a
# loose script and is not part of the distribution.
module-root = "src/python"
module-name = "novelty"

[tool.ruff]
line-length = 100
src = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# `novelty` is installed editable, but keeping src/python on sys.path means the
# tests also run against a bare checkout that has not been synced.
pythonpath = ["src/python"]
