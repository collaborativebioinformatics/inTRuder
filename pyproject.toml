[project]
name = "noveltrs"
version = "0.1.0"
description = "Identifying novel human tandem-repeat loci absent from the reference genome"
readme = "README.md"
requires-python = ">=3.11"
# Add runtime dependencies here, e.g. with `uv add pandas`
dependencies = [
    "cyvcf2>=0.34.0",
    "numpy>=2.0",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pytrf>=1.5.0",
    "tqdm>=4.70.0",
    "pandas>=3.0.5",
    "joblib>=1.3",
]

[project.scripts]
# `uv run novelty ...` / `uv run strchive ...` from anywhere in the repo.
svpytrf  = "svpytrf.sv_trfcaller:main"
filter   = "filter.filter_ins_trf:main"
novelty  = "novelty.cli:main"
strchive = "strchive.__main__:main"

[dependency-groups]
# Dev-only tooling; install with `uv sync` (included by default)
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "matplotlib>=3.11.1",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
]

# The DNAnexus toolkit, for `scripts/dx-*.sh` and anything else that talks to the
# platform. A group rather than a runtime dependency because nothing under `src/`
# imports it and DNAnexus workers already ship the `dx` CLI; not in `dev` because
# `uv sync` installs `dev` by default and this is only useful with a token in
# `.env`. Install it with `uv sync --group dx`; see docs/scripts/DNANexus.md.
dx = [
    "dxpy>=0.412.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The pipeline-step packages, plus the `trcore` primitives they share, are
# installed (editable, so edits take effect at once) to put their commands on
# PATH. Loose scripts under src/python -- such as sv_trfcaller.py -- stay
# scripts and are not part of the distribution.
module-root = "src/python"
module-name = ["trcore", "novelty", "strchive", "svpytrf", "filter"]

[tool.ruff]
line-length = 100
src = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Each step keeps its own test package, so basenames repeat across them
# (tests/python/novelty/test_catalog.py and tests/python/strchive/test_catalog.py).
# importlib mode imports each by full path instead of by basename, which is
# what lets the two coexist without __init__.py scaffolding.
addopts = ["--import-mode=importlib"]
# The step packages are installed editable, but keeping src/python on sys.path
# means the tests also run against a bare checkout that has not been synced.
pythonpath = ["src/python"]
