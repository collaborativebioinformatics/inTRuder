[project]
name = "intruder-backend"
version = "1.0.0"
description = "FastAPI + LangGraph service backing the inTRuder web interface"
readme = "README.md"
# Held at <3.13: sentence-transformers needs torch, and torch's last macOS
# x86_64 wheels (2.2.2) are cp312-max, so an Intel Mac cannot run this on 3.13.
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "pyhpo>=4.0.0",
    # An Intel Mac is a dead end for the current stack: torch's last macOS
    # x86_64 wheels are 2.2.2, sentence-transformers 6 requires transformers 5,
    # and transformers 5 does not work against torch 2.2. So that one platform
    # holds at the last combination that resolves; everywhere else takes current.
    # `resolve_phenotype` only calls SentenceTransformer(...).encode(), which is
    # unchanged across these versions.
    "sentence-transformers>=6.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "sentence-transformers>=5.1,<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # torch 2.2.2 is built against the NumPy 1.x C API; with NumPy 2 installed it
    # loads but every tensor<->array conversion fails, which is exactly what
    # embed_text does.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "claude-agent-sdk>=0.2.148",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "httpx2>=0.28",
]

[tool.uv]
# Standalone application project. Deliberately NOT a member of any workspace:
# the root pyproject.toml manages the research pipeline under src/python and the
# two dependency sets are kept fully separate.
package = false

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint.isort]
# `app` is a top-level package in this directory rather than an installed one, so
# say so explicitly: without it the import sorter's answer depends on how it
# happens to resolve the path, and flips between runs.
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The literature canaries call Europe PMC. They are the only tests that need a
# network, and they exist to tell us when the upstream quirks this module works
# around have been fixed — so they are opt-in: `uv run pytest -m network`.
markers = ["network: hits a third-party API; deselected by default"]
addopts = "-m 'not network'"
# `app` is a top-level package in this directory, not an installed one.
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# The sample list and motif pool read better as wrapped blocks than as one long
# list literal, and they are transcriptions of real callset values.
"scripts/make_demo_data.py" = ["SIM905"]
