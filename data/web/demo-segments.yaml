name: demo_segments
title: Demo per-allele repeat structure (SYNTHETIC)
synthetic: true
path: demo/segments.parquet
format: parquet

description: >
  One row per structural segment within one sample's inserted allele at one locus,
  in left-to-right order. An allele is a run of segments: repeat blocks carrying a
  motif and copy number, separated by non-repetitive flank. This is the table that
  drives the motif-barcode visualization, and the table to query for allele-level
  questions: copy-number variation between samples, compound or nested repeat
  structure, and how much of an insertion is actually repetitive.
  SYNTHETIC DEMO DATA generated by backend/scripts/make_demo_data.py. Not a result.

columns:
  locus_id: Locus identifier, joins to demo_loci.locus_id.
  sample: Sample identifier, e.g. HG00290. 68 samples in the cohort.
  seg_index: Zero-based position of this segment within the allele, left to right.
  seg_type: Either "repeat" (a tandem array) or "flank" (non-repetitive sequence).
  start: Segment start offset in bp within the inserted allele.
  end: Segment end offset in bp within the inserted allele.
  motif: Repeat motif for this block, canonicalized. Null for flank segments.
  purity: Identity to a perfect repeat for this block, 0-1. Null for flank segments.
  units: Motif copy number in this block. Null for flank segments.

provenance:
  source: Synthetic, generated by backend/scripts/make_demo_data.py
  license: CC0-1.0
