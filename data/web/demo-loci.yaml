name: demo_loci
title: Demo candidate TR loci (SYNTHETIC)
synthetic: true
path: demo/loci.parquet
format: parquet

description: >
  One row per candidate tandem-repeat locus discovered in insertion calls across a
  68-genome long-read cohort. Each locus has a canonical repeat motif, cohort
  support, allele-size range, and whether it is already present in existing TR
  catalogs. This is the table to query for cohort-level questions: how many loci
  are novel, how novelty varies by motif class or chromosome, and which novel loci
  fall in disease-associated genes.
  Each locus also carries the reference screen: the combined novelty verdict plus
  an independent block of columns per reference catalog (ucsc_, trexplorer_),
  recording what hg38 annotates at that position. Query these to compare a locus
  against the reference rather than describing it alone.
  SYNTHETIC DEMO DATA generated by backend/scripts/make_demo_data.py - the sample
  names, motif-length mix and every reference-screen distribution are measured
  from the real HPRC callset, but the real table is never read and every locus,
  coordinate, allele, verdict and reference repeat is fabricated. Not a result.

columns:
  locus_id: Stable locus identifier, e.g. TRL000123.
  chrom: Chromosome of the insertion site (GRCh38).
  pos: Insertion-site position on that chromosome.
  motif: Repeat motif, canonicalized to the smallest rotation of itself or its reverse complement.
  motif_len: Length of the motif in bp.
  motif_class: One of homopolymer (1bp), STR (2-6bp), mid (7-20bp), VNTR (>20bp).
  n_samples: Number of the 68 cohort samples carrying an insertion at this locus.
  median_len: Median inserted-allele length in bp across carriers.
  min_len: Shortest inserted allele in bp.
  max_len: Longest inserted allele in bp.
  mean_purity: Mean identity to a perfect repeat across carriers, 0-1.
  novel: True when no catalog contains this repeat. Equivalent to novelty <> 'known'.
  catalogs: Semicolon-separated catalogs containing this repeat; empty when novel.
  gene: Overlapping or nearest gene symbol, null when intergenic.
  disease_gene: True when that gene has a known pathogenic repeat expansion.

  # The reference screen. Three-valued, not boolean - "the reference has repeats
  # here but none with this motif" and "the reference annotates nothing here" are
  # different findings. See docs/tools/NOVELTY_SCREEN.md.
  novelty: >
    Combined verdict, the least novel across catalogs. 'known' = a reference repeat
    with an equivalent motif sits here; 'novel_motif' = the reference has repeats
    here but none with this motif; 'novel_locus' = the reference annotates no repeat
    at all within 10 bp. This is the headline field.
  insertion_purity: >
    Fraction of the inserted sequence that is tandem repeat at all, 0-1. The column
    that separates a real novel TR from a mobile element carrying a poly-A tail:
    homopolymer loci sit near 0.09, VNTRs near 0.89. Filter on it before believing
    a novelty count.

  ucsc_novelty: The same three-valued verdict from the UCSC simpleRepeat track alone (1.05M entries).
  ucsc_n_nearby: UCSC repeats within 10 bp of the insertion point. 0 means novel_locus.
  ucsc_start: Start of the best-matching UCSC repeat, in GRCh38 coordinates. Null when none.
  ucsc_end: End of that repeat. end - start is how much reference sequence it covers.
  ucsc_distance: bp from the insertion point to that repeat; 0 means the point is inside it.
  ucsc_motif: Motif of that repeat, at whatever rotation TRF reported it.
  ucsc_motif_edits: 0 when the motifs are equivalent, 1 when not. Binary, not a distance, because motif tolerance is off.
  ucsc_period: TRF period of that repeat. Equals motif_len on most 'known' calls.
  ucsc_copy_num: TRF copy number of that repeat.
  ucsc_per_match: TRF percent identity of that repeat, 0-100. A percentage, unlike mean_purity which is a fraction.

  trexplorer_novelty: The same verdict from the TRExplorer catalog alone (5.6M entries, position and motif only).
  trexplorer_n_nearby: TRExplorer repeats within 10 bp.
  trexplorer_start: Start of the best-matching TRExplorer repeat, GRCh38. Null when none.
  trexplorer_end: End of that repeat.
  trexplorer_distance: bp to that repeat; 0 means overlapping.
  trexplorer_motif: Motif of that repeat.
  trexplorer_motif_edits: 0 when equivalent to ours, 1 when not.

provenance:
  source: Synthetic, generated by backend/scripts/make_demo_data.py
  license: CC0-1.0
